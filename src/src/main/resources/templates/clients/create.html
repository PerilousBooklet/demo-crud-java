<!DOCTYPE html>
<html>
  
  <head>
    <title>Demo CRUD Java - Create New Client</title>
  </head>

  <style>
    .error { color: red; }
  </style>
  
  <body style="display: flex; justify-content: center;">
    
    <div>
      <h2>New Client</h2>
      <form method="POST" th:object="${clientDto}" style="display: flex; flex-direction: column; gap: 1rem; max-width: 400px;">
        <!-- FIRST NAME -->
        <div>
          <label>First Name</label>
          <input th:field="${clientDto.firstName}">
          <p th:if="${#fields.hasErrors('firstName')}" th:errorclass="error" th:errors="${clientDto.firstName}"></p>
        </div>
        <!-- LAST NAME -->
        <div>
          <label>Last Name</label>
          <input th:field="${clientDto.lastName}">
          <p th:if="${#fields.hasErrors('lastName')}" th:errorclass="error" th:errors="${clientDto.lastName}"></p>
        </div>
        <!-- EMAIL -->
        <div>
          <label>Email</label>
          <input th:field="${clientDto.email}">
          <p th:if="${#fields.hasErrors('email')}" th:errorclass="error" th:errors="${clientDto.email}"></p>
        </div>
        <!-- PHONE -->
        <div>
          <label>Phone</label>
          <input th:field="${clientDto.phone}">
          <p th:if="${#fields.hasErrors('phone')}" th:errorclass="error" th:errors="${clientDto.phone}"></p>
        </div>
        <!-- ADDRESS -->
        <div>
          <label>Address</label>
          <input th:field="${clientDto.address}">
          <p th:if="${#fields.hasErrors('address')}" th:errorclass="error" th:errors="${clientDto.address}"></p>
        </div>
        <!-- STATUS -->
        <div>
          <label>Status</label>
          <select th:field="${clientDto.status}">
            <!-- TODO: write list of status items in the backend -->
            <!-- TODO: list them here with a for loop -->
            <option value="New">New</option>
            <option value="Permanent">Permanent</option>
            <option value="Lead">Lead</option>
            <option value="Occasional">Occasional</option>
            <option value="Inactive">Inactive</option>
          </select>
          <p th:if="${#fields.hasErrors('status')}" th:errorclass="error" th:errors="${clientDto.status}"></p>
        </div>
        <!-- SUBMIT/CANCEL -->
        <div>
          <button type="submit">Submit</button>
          <a href="/clients">Cancel</a>
        </div>
      </form>
    </div>
    
  </body>
  
</html>
